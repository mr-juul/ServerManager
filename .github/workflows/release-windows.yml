name: Release Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (for example v1.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc')) }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if (-not $tag) {
            throw "No tag could be resolved for this release run."
          }

          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync app version from tag
        shell: pwsh
        run: |
          python .\scripts\sync_version.py --tag "${{ steps.tag.outputs.tag_name }}"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\build_windows.ps1

      - name: Sign executables (optional)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host "Signing skipped: certificate secrets are not configured."
            exit 0
          }

          [IO.File]::WriteAllBytes("codesign.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $files = @(
            ".\dist\ServerManager\ServerManager.exe",
            ".\dist\ServerManager\ServerManagerWatchdog.exe",
            ".\dist\ServerManager\ServerManagerUpdater.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing file for signing: $file"
            }
            signtool sign /f codesign.pfx /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file
          }

      - name: Create release zip
        shell: pwsh
        run: |
          if (Test-Path .\dist\ServerManager.zip) {
            Remove-Item .\dist\ServerManager.zip -Force
          }
          Compress-Archive -Path .\dist\ServerManager\* -DestinationPath .\dist\ServerManager.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: dist/ServerManager.zip
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
